name: Update Profile Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (4 times a day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate SVG cards
        env:
          WAKATIME_USERNAME: steveenecheverri
          GITHUB_LOGIN: StyvenSoft
          # Shareable JSON "Coding Activity" (Last 7 Days). Es un enlace pensado para ser publico.
          WEEK_SHARE_URL: https://wakatime.com/share/@steveenecheverri/bc74d827-dc6b-43d4-9be8-7776db162a63.json
          # Opcional: con este secret la semana sale apilada por lenguaje. Sin el, usa el Shareable (totales por dia).
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          YEARLY_GOAL_HOURS: "400"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: wakatime
        run: |
          set -euo pipefail
          node scripts/profile-cards.mjs

      - name: Bump README cache-buster for wakatime/*.svg (daily)
        run: |
          set -euo pipefail
          V="$(date -u +%Y%m%d)"  # changes once per day
          sed -i -E "s#(wakatime/[a-z-]+\.svg)\?v=[0-9]+#\1?v=$V#g" README.md
          sed -i -E "s#(wakatime/[a-z-]+\.svg)(\"|')#\1?v=$V\2#g" README.md

      - name: Commit changes to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wakatime README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile stats cards (cache-bust v=$(date -u +%Y%m%d))"
          git push
